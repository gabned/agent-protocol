name: Agent Protocol conformance
on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trusted-scope:
    if: github.event_name == 'pull_request_target'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard using the accepted base only
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git init .
          git -c credential.helper= fetch --no-tags https://github.com/gabned/agent-protocol.git "$BASE"
          git checkout --detach "$BASE"
          git -c credential.helper= fetch --no-tags https://github.com/gabned/agent-protocol.git "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD"
          python tools/guard.py --event "$GITHUB_EVENT_PATH"
  conformance:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/check.py
      - run: git diff --exit-code
